<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<title>Tile2D · 柏林噪声</title>
<style>
    :root {
        --bg: #0b0d12;
        --panel: rgba(19, 23, 32, .92);
        --line: rgba(255, 255, 255, .10);
        --text: #e8ecf4;
        --dim: #8b93a7;
        --accent: #4c9dff;
        --accent-soft: rgba(76, 157, 255, .16);
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    /* ==================== 瓦片容器（对照 TileLayout 这个 ViewGroup） ==================== */
    #view {
        position: fixed;
        left: 0; top: 0;
        width: 100%;
        height: 100%;
        display: block;            /* canvas 元素 */
        background: #0e1117;       /* 首帧 / 稀疏区底色 */
        touch-action: none;
        cursor: grab;
    }
    #view.dragging { cursor: grabbing; }

    /* ==================== 顶部条 ==================== */
    #topbar {
        position: fixed;
        top: calc(var(--safe-t) + 8px);
        left: calc(var(--safe-l) + 10px);
        right: calc(var(--safe-r) + 10px);
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 10;
        pointer-events: none;
    }
    .chip {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: 13px;
        white-space: nowrap;
    }
    .chip.brand { font-weight: 600; letter-spacing: .2px; }
    .chip.brand em { font-style: normal; color: var(--accent); }
    #status {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
    }
    #menuBtn {
        pointer-events: auto;
        width: 40px; height: 40px;
        flex: 0 0 auto;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
    }
    #menuBtn:active { transform: scale(.94); }

    /* ==================== 调试 HUD ==================== */
    #hud {
        position: fixed;
        left: calc(var(--safe-l) + 10px);
        bottom: calc(var(--safe-b) + 10px);
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(19, 23, 32, .52);   /* 半透明，方便透看背后的瓦片 */
        border: 1px solid var(--line);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9fd0ff;
        white-space: pre;
        z-index: 9;
        display: none;
    }
    #hud.on { display: block; }

    /* 调试叠层：视窗边框（对应 DebugLayer；位置由 JS 按引擎视窗 = 内边距内缩设置） */
    #debugBox {
        position: fixed;
        border: 1px dashed rgba(76, 157, 255, .55);
        pointer-events: none;
        z-index: 8;
        display: none;
    }
    #debugBox.on { display: block; }

    /* ==================== 提示条 ==================== */
    #toast {
        position: fixed;
        left: 50%;
        top: calc(var(--safe-t) + 56px);
        transform: translate(-50%, -8px);
        max-width: calc(100vw - 40px);
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, .78);
        border: 1px solid var(--line);
        color: #fff;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s ease, transform .18s ease;
        z-index: 20;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    #toast.on { opacity: 1; transform: translate(-50%, 0); }

    /* ==================== 菜单面板 ==================== */
    #mask {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .45);
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s ease;
        z-index: 30;
    }
    #mask.on { opacity: 1; pointer-events: auto; }

    #sheet {
        position: fixed;
        left: calc(var(--safe-l) + 8px);
        right: calc(var(--safe-r) + 8px);
        bottom: calc(var(--safe-b) + 8px);
        max-height: 76vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
        transform: translateY(calc(100% + 24px));
        transition: transform .24s cubic-bezier(.22, .9, .24, 1);
        z-index: 31;
        padding: 14px 14px 18px;
    }
    #sheet.on { transform: translateY(0); }

    .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }
    .sheet-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .sheet-head button {
        width: 32px; height: 32px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--dim);
        font-size: 16px;
        cursor: pointer;
    }

    .group { margin: 12px 0 4px; }
    .group > .label {
        font-size: 12px;
        color: var(--dim);
        margin: 0 0 8px 2px;
        letter-spacing: .3px;
    }

    .row { display: flex; flex-wrap: wrap; gap: 8px; }

    .item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, .03);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
    }
    .item:active { background: var(--accent-soft); }
    .item.switch.on {
        border-color: rgba(76, 157, 255, .5);
        background: var(--accent-soft);
        color: #cfe6ff;
    }
    .item.switch .dot {
        width: 30px; height: 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, .16);
        position: relative;
        transition: background .18s ease;
    }
    .item.switch .dot::after {
        content: '';
        position: absolute;
        top: 2px; left: 2px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform .18s ease;
    }
    .item.switch.on .dot { background: var(--accent); }
    .item.switch.on .dot::after { transform: translateX(12px); }

    .grid8 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }
    .grid8 .item { justify-content: center; padding: 0 6px; font-size: 12px; }

    .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--dim);
        line-height: 1.7;
    }
    .hint code {
        color: #b9d6ff;
        background: rgba(255, 255, 255, .06);
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 11px;
    }

    /* 桌面端放宽一点 */
    @media (min-width: 820px) {
        #sheet { left: 50%; right: auto; width: 560px; transform: translate(-50%, calc(100% + 24px)); }
        #sheet.on { transform: translate(-50%, 0); }
        .grid8 { grid-template-columns: repeat(4, 1fr); }
    }
</style>
</head>
<body>

<!-- 自绘画布：视窗内的所有瓦片都画在这里 -->
<canvas id="view"></canvas>

<div id="debugBox"></div>

<div id="topbar">
    <span class="chip brand">Tile<em>2D</em></span>
    <span class="chip" id="status">初始化中…</span>
    <button id="menuBtn" aria-label="菜单">☰</button>
</div>

<div id="hud"></div>
<div id="toast"></div>

<div id="mask"></div>

<div id="sheet" role="dialog" aria-label="菜单">
    <div class="sheet-head">
        <h2>菜单</h2>
        <button id="closeBtn" aria-label="关闭">✕</button>
    </div>

    <div class="group">
        <div class="label">模式</div>
        <div class="row">
            <button class="item switch" id="m-debug"><span class="dot"></span>Debug 模式</button>
            <button class="item switch" id="m-max"><span class="dot"></span>伪无限模式</button>
        </div>
    </div>

    <div class="group">
        <div class="label">随机调整尺寸（视窗中心那一列 / 那一行）</div>
        <div class="row">
            <button class="item" id="m-rand-w">随机调整宽度</button>
            <button class="item" id="m-rand-h">随机调整高度</button>
        </div>
    </div>

    <div class="group">
        <div class="label">去边界看看</div>
        <div class="grid8">
            <button class="item" data-end="tl">左上角</button>
            <button class="item" data-end="t">最上边</button>
            <button class="item" data-end="tr">右上角</button>
            <button class="item" data-end="l">最左边</button>
            <button class="item" data-end="origin">回到原点</button>
            <button class="item" data-end="r">最右边</button>
            <button class="item" data-end="bl">左下角</button>
            <button class="item" data-end="b">最下边</button>
            <button class="item" data-end="br">右下角</button>
        </div>
    </div>

    <div class="group">
        <div class="label">视图</div>
        <div class="row">
            <button class="item" id="m-zoom-in">放大</button>
            <button class="item" id="m-zoom-out">缩小</button>
            <button class="item" id="m-zoom-reset">重置缩放</button>
        </div>
    </div>

    <div class="hint">
        单指拖动 / 鼠标拖动滚动（松手带惯性）·双指捏合缩放·双击放大/还原·<code>Ctrl</code>+滚轮缩放<br>
        单击瓦片看坐标 · 自绘渲染（Canvas，无 DOM 瓦片）<br>
        数据与 app 端柏林噪声 demo 逐位一致（种子 123456789，缩放 0.03，文本方案）
    </div>
</div>

<script src="noise.js"></script>
<script src="tile2d.js"></script>
<script src="main.js"></script>
</body>
</html>
