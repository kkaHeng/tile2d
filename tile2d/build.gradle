plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    namespace 'com.ahheng.tile2d'
    compileSdk 34

    defaultConfig {
        minSdk 21
        versionName project.findProperty('version.name')
    }

    buildTypes {
        release {
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {

}

group = 'com.github.kkaHeng'

// 版本号必须由 gradle.properties 提供：缺失即报错中断构建，避免静默发出错误版本
def versionName = project.findProperty('version.name')
if (versionName == null) {
    throw new GradleException("缺少 'version.name'（应在 gradle.properties 中定义），已阻止构建。")
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.kkaHeng'
                artifactId = 'tile2d'
                version = versionName
            }
        }
    }
}
